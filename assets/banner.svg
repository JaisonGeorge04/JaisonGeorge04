<svg width="1200" height="500"
viewBox="0 0 1200 500"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#fff7b0"/>
<stop offset="20%" stop-color="#ffd700"/>
<stop offset="45%" stop-color="#b8860b"/>
<stop offset="70%" stop-color="#ffe88a"/>
<stop offset="100%" stop-color="#8a6508"/>

</linearGradient>


<radialGradient id="darkBg">

<stop offset="0%" stop-color="#211600"/>
<stop offset="45%" stop-color="#090909"/>
<stop offset="100%" stop-color="#000000"/>

</radialGradient>


<filter id="textShadow">

<feDropShadow
dx="0"
dy="12"
stdDeviation="10"
flood-color="#000000"/>

</filter>


<linearGradient id="shine">

<stop offset="0%" stop-color="transparent"/>
<stop offset="50%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="transparent"/>

</linearGradient>


</defs>


<!-- Background -->

<rect width="1200"
height="500"
rx="35"
fill="url(#darkBg)"/>


<!-- Outer Frame -->

<rect x="20"
y="20"
width="1160"
height="460"
rx="35"
fill="none"
stroke="#d4af37"
stroke-width="3"/>


<!-- Inner Frame -->

<rect x="35"
y="35"
width="1130"
height="430"
rx="30"
fill="none"
stroke="#6f5200"
stroke-width="1"/>



<!-- Circuit Corners -->

<g stroke="#d4af37"
stroke-width="3"
fill="none">

</g>

<!-- Name Shadow -->

<text
x="600"
y="190"
text-anchor="middle"
font-family="Arial Black, Arial"
font-size="110"
font-weight="900"
fill="#4d3200">

JAISON GEORGE

</text>


<!-- Main Gold Name -->

<text
x="600"
y="175"
text-anchor="middle"
font-family="Arial Black, Arial"
font-size="110"
font-weight="900"
fill="url(#goldMetal)"
filter="url(#textShadow)">

JAISON GEORGE


<animate
attributeName="opacity"
values="0.85;1;0.85"
dur="3s"
repeatCount="indefinite"/>


</text>

<!-- Moving Shine -->

<rect
x="-300"
y="70"
width="220"
height="180"
fill="url(#shine)"
opacity="0.25">


<animate
attributeName="x"
from="-300"
to="1300"
dur="5s"
repeatCount="indefinite"/>

</rect>
    <!-- Developer Role -->

<text
x="600"
y="260"
text-anchor="middle"
font-family="Arial"
font-size="34"
font-weight="700"
fill="#ffffff">

SOFTWARE DEVELOPER | AI ENGINEER | CLOUD &amp; DEVOPS

</text>




<!-- Developer Role -->

<text
x="600"
y="260"
text-anchor="middle"
font-family="Arial"
font-size="34"
font-weight="700"
fill="#ffffff">

SOFTWARE DEVELOPER | AI ENGINEER | CLOUD &amp; DEVOPS

</text>


<!-- Technology Section -->

<g transform="translate(110,320)"
font-family="Arial"
text-anchor="middle">



<!-- Python -->

<g>

    <circle
        cx="50"
        cy="35"
        r="38"
        fill="#3776AB"
        stroke="#ffd700"
        stroke-width="3">

        <animate
            attributeName="opacity"
            values="0.7;1;0.7"
            dur="3s"
            repeatCount="indefinite"/>

    </circle>


    <!-- Python Logo -->
    <g transform="translate(20,4) scale(0.30)">

        <!-- Blue Python -->
        <path
            fill="#FFFFFF"
            d="M83.6 0C40.7 0 43.4 18.6 43.4 18.6l.05 19.2h40.9v5.8H27.2S0 40.5 0 83.4s23.8 41.3 23.8 41.3H38V104.8S37.3 81 61.4 81H102s22.8.4 22.8-22.1V22S128.3 0 83.6 0z

            M61 13
            a7.4 7.4 0 1 1 0 14.8
            a7.4 7.4 0 1 1 0-14.8z"
        />

        <!-- Yellow Python -->
        <path
            fill="#FFD43B"
            d="M84 167C127 167 124.3 148.4 124.3 148.4l-.05-19.2H83.3v-5.8h57.2s27.2 3.1 27.2-39.8-23.8-41.3-23.8-41.3h-14.2v19.9s.7 23.8-23.4 23.8H65.7s-22.8-.4-22.8 22.1V145s-3.5 22 41.1 22z

            M106.6 154
            a7.4 7.4 0 1 1 0-14.8
            a7.4 7.4 0 1 1 0 14.8z"
        />

    </g>


    <text
        x="50"
        y="115"
        font-size="18"
        fill="#ffd700">
        Python
    </text>

</g>




<!-- AWS -->

<g transform="translate(170,0)">


<circle cx="50"
cy="35"
r="38"
