y="465"
text-anchor="middle"
font-family="monospace"
font-size="22"
letter-spacing="4"
fill="#d4af37">

BUILD • DEPLOY • INNOVATE

</text>




<!-- Floating Gold Particles -->

<g fill="#ffd700">


<circle cx="260" cy="90" r="4">

<animate
attributeName="cy"
values="90;60;90"
dur="3s"
repeatCount="indefinite"/>

</circle>



<circle cx="930" cy="100" r="3">

