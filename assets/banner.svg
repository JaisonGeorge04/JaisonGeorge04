<svg width="1200" height="500"
viewBox="0 0 1200 500"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#fff7b0"/>
<stop offset="20%" stop-color="#ffd700"/>
<stop offset="45%" stop-color="#b8860b"/>
<stop offset="70%" stop-color="#ffe88a"/>
<stop offset="100%" stop-color="#8a6508"/>

</linearGradient>


<radialGradient id="darkBg">

<stop offset="0%" stop-color="#211600"/>
<stop offset="45%" stop-color="#090909"/>
<stop offset="100%" stop-color="#000000"/>

</radialGradient>


<filter id="textShadow">

<feDropShadow
dx="0"
dy="12"
stdDeviation="10"
flood-color="#000000"/>

</filter>


<linearGradient id="shine">

<stop offset="0%" stop-color="transparent"/>
<stop offset="50%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="transparent"/>

</linearGradient>


</defs>


<!-- Background -->

<rect width="1200"
height="500"
rx="35"
fill="url(#darkBg)"/>


<!-- Outer Frame -->

<rect x="20"
y="20"
width="1160"
height="460"
rx="35"
fill="none"
stroke="#d4af37"
stroke-width="3"/>


<!-- Inner Frame -->

<rect x="35"
y="35"
width="1130"
height="430"
rx="30"
fill="none"
stroke="#6f5200"
stroke-width="1"/>



<!-- Circuit Corners -->

<g stroke="#d4af37"
stroke-width="3"
fill="none">

</g>

<!-- Name Shadow -->

<text
x="600"
y="190"
text-anchor="middle"
font-family="Arial Black, Arial"
font-size="110"
font-weight="900"
fill="#4d3200">

JAISON GEORGE

</text>


<!-- Main Gold Name -->

<text
x="600"
y="175"
text-anchor="middle"
font-family="Arial Black, Arial"
font-size="110"
font-weight="900"
fill="url(#goldMetal)"
filter="url(#textShadow)">

JAISON GEORGE


<animate
attributeName="opacity"
values="0.85;1;0.85"
dur="3s"
repeatCount="indefinite"/>


</text>

<!-- Moving Shine -->

<rect
x="-300"
y="70"
width="220"
height="180"
fill="url(#shine)"
opacity="0.25">


<animate
attributeName="x"
from="-300"
to="1300"
dur="5s"
repeatCount="indefinite"/>

</rect>
