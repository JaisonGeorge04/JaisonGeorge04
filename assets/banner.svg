<text
x="600"
y="260"
text-anchor="middle"
font-family="Arial"
font-size="34"
font-weight="700"
fill="#ffffff">

SOFTWARE DEVELOPER | AI ENGINEER | CLOUD &amp; DEVOPS

</text>




<!-- Developer Role -->

