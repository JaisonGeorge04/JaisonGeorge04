<svg width="1200" height="500"
viewBox="0 0 1200 500"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#fff7b0"/>
<stop offset="20%" stop-color="#ffd700"/>
<stop offset="45%" stop-color="#b8860b"/>
<stop offset="70%" stop-color="#ffe88a"/>
<stop offset="100%" stop-color="#8a6508"/>

</linearGradient>


<radialGradient id="darkBg">

<stop offset="0%" stop-color="#211600"/>
<stop offset="45%" stop-color="#090909"/>
<stop offset="100%" stop-color="#000000"/>

</radialGradient>


<filter id="textShadow">

<feDropShadow
dx="0"
dy="12"
stdDeviation="10"
flood-color="#000000"/>

</filter>


<linearGradient id="shine">

<stop offset="0%" stop-color="transparent"/>
<stop offset="50%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="transparent"/>

</linearGradient>


</defs>


<!-- Background -->

<rect width="1200"
height="500"
rx="35"
fill="url(#darkBg)"/>


<!-- Outer Frame -->

<rect x="20"
y="20"
width="1160"
height="460"
rx="35"
fill="none"
stroke="#d4af37"
stroke-width="3"/>


<!-- Inner Frame -->

<rect x="35"
y="35"
width="1130"
height="430"
rx="30"
fill="none"
stroke="#6f5200"
stroke-width="1"/>



<!-- Circuit Corners -->

<g stroke="#d4af37"
stroke-width="3"
fill="none">

</g>

<!-- Name Shadow -->

<text
x="600"
y="190"
text-anchor="middle"
font-family="Arial Black, Arial"
font-size="110"
font-weight="900"
fill="#4d3200">

JAISON GEORGE

</text>


<!-- Main Gold Name -->

<text
x="600"
y="175"
text-anchor="middle"
font-family="Arial Black, Arial"
font-size="110"
font-weight="900"
fill="url(#goldMetal)"
filter="url(#textShadow)">

JAISON GEORGE


<animate
attributeName="opacity"
values="0.85;1;0.85"
dur="3s"
repeatCount="indefinite"/>


</text>

<!-- Moving Shine -->

<rect
x="-300"
y="70"
width="220"
height="180"
fill="url(#shine)"
opacity="0.25">


<animate
attributeName="x"
from="-300"
to="1300"
dur="5s"
repeatCount="indefinite"/>

</rect>
    <!-- Developer Role -->

<text
x="600"
y="260"
text-anchor="middle"
font-family="Arial"
font-size="34"
font-weight="700"
fill="#ffffff">

SOFTWARE DEVELOPER | AI ENGINEER | CLOUD &amp; DEVOPS

</text>




<!-- Developer Role -->

<text
x="600"
y="260"
text-anchor="middle"
font-family="Arial"
font-size="34"
font-weight="700"
fill="#ffffff">

SOFTWARE DEVELOPER | AI ENGINEER | CLOUD &amp; DEVOPS

</text>


<!-- Technology Section -->

<g transform="translate(110,320)"
font-family="Arial"
text-anchor="middle">



<!-- Python -->
<g>
    <circle cx="50" cy="35" r="38"
        fill="#111111"
        stroke="#ffd700"
        stroke-width="3"/>

    <!-- Python official-style logo -->
    <g transform="translate(20,4) scale(0.32)">
        <path fill="#3776AB"
            d="M83.6 0C40.7 0 43.4 18.6 43.4 18.6l.05 19.2h40.9v5.8H27.2S0 40.5 0 83.4s23.8 41.3 23.8 41.3H38V104.8S37.3 81 61.4 81H102s22.8.4 22.8-22.1V22S128.3 0 83.6 0z
            M61 13a7.4 7.4 0 1 1 0 14.8a7.4 7.4 0 1 1 0-14.8z"/>

        <path fill="#FFD43B"
            d="M84 167C127 167 124.3 148.4 124.3 148.4l-.05-19.2H83.3v-5.8h57.2s27.2 3.1 27.2-39.8-23.8-41.3-23.8-41.3h-14.2v19.9s.7 23.8-23.4 23.8H65.7s-22.8-.4-22.8 22.1V145s-3.5 22 41.1 22z
            M106.6 154a7.4 7.4 0 1 1 0-14.8a7.4 7.4 0 1 1 0 14.8z"/>
    </g>

    <text x="50" y="115"
        font-size="18"
        fill="#ffd700">
        Python
    </text>
</g>


<!-- AWS -->
<g transform="translate(170,0)">

    <circle
        cx="50" cy="35" r="38"
        fill="#111111"
        stroke="#ff9900"
        stroke-width="3"/>

    <!-- AWS -->
    <g transform="translate(50,35)">
        <text
            x="0" y="2"
            text-anchor="middle"
            font-family="Arial, sans-serif"
            font-size="22"
            font-weight="bold"
            fill="#FF9900">aws</text>

        <!-- Smile -->
        <path
            d="M-25 12
               C-12 22, 10 24, 25 14"
            fill="none"
            stroke="#FF9900"
            stroke-width="3.5"
            stroke-linecap="round"/>

        <!-- Arrow -->
        <path
            d="M20 12 L27 13 L24 20"
            fill="none"
            stroke="#FF9900"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <text x="50" y="115"
        font-size="18"
        fill="#ffd700">
        AWS
    </text>

</g>



<!-- Docker -->
<g transform="translate(340,0)">

    <circle
        cx="50" cy="35" r="38"
        fill="#2496ED"
        stroke="white"
        stroke-width="3"/>

    <!-- Docker Whale -->
    <g transform="translate(14,11)" fill="#FFFFFF">

        <!-- Containers -->
        <rect x="12" y="14" width="9" height="8" rx="1"/>
        <rect x="23" y="14" width="9" height="8" rx="1"/>
        <rect x="34" y="14" width="9" height="8" rx="1"/>
        <rect x="45" y="14" width="9" height="8" rx="1"/>

        <rect x="23" y="4" width="9" height="8" rx="1"/>
        <rect x="34" y="4" width="9" height="8" rx="1"/>
        <rect x="45" y="4" width="9" height="8" rx="1"/>

        <rect x="34" y="-6" width="9" height="8" rx="1"/>

        <!-- Whale body -->
        <path
            d="M5 25
               H55
               C58 25 61 24 64 21
               C67 18 70 17 75 18
               C73 22 70 25 66 27
               C64 42 53 50 35 50
               C18 50 8 43 5 25Z"/>

        <!-- Whale tail -->
        <path
            d="M64 22
               C70 20 75 22 78 26
               C73 29 68 29 63 27Z"/>

        <!-- Eye -->
        <circle cx="55" cy="30" r="1.5" fill="#2496ED"/>

    </g>

    <text x="50" y="115"
        font-size="18"
        fill="#ffd700">
        Docker
    </text>

</g>



<!-- Terraform -->
<g transform="translate(510,0)">

    <circle
        cx="50" cy="35" r="38"
        fill="#7B42BC"
        stroke="white"
        stroke-width="3"/>

    <!-- Terraform Logo -->
    <g transform="translate(28,9)" fill="#FFFFFF">

        <!-- Top-left -->
        <path
            d="M0 4
               L17 14
               V34
               L0 24Z"/>

        <!-- Bottom-left -->
        <path
            d="M20 16
               L37 26
               V46
               L20 36Z"/>

        <!-- Top-right -->
        <path
            d="M20 -6
               L37 4
               V23
               L20 13Z"/>

        <!-- Right block -->
        <path
            d="M40 5
               L57 15
               V34
               L40 24Z"/>

    </g>

    <text x="50" y="115"
        font-size="18"
        fill="#ffd700">
        Terraform
    </text>

</g>



!-- Jenkins -->
<g transform="translate(680,0)">

    <circle
        cx="50"
        cy="35"
        r="38"
        fill="#D24939"
        stroke="white"
        stroke-width="3"/>

    <!-- Jenkins Logo -->
    <g transform="translate(...) scale(...)">
        <!-- Jenkins official logo SVG paths go here -->
    </g>

    <text
        x="50"
        y="115"
        font-size="18"
        fill="#ffd700">
        Jenkins
    </text>

</g>


<!-- AI / ML -->
<g transform="translate(850,0)">

    <circle
        cx="50" cy="35" r="38"
        fill="#050505"
        stroke="#ffd700"
        stroke-width="3"/>

    <!-- AI Brain / Circuit Logo -->
    <g
        transform="translate(50,35)"
        fill="none"
        stroke="#FFD700"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round">

        <!-- Brain left -->
        <path
            d="M-2 -23
               C-10 -27 -17 -22 -17 -15
               C-24 -14 -27 -7 -23 -1
               C-28 4 -25 12 -18 14
               C-19 22 -11 27 -3 22
               V-23Z"/>

        <!-- Brain right -->
        <path
            d="M2 -23
               C10 -27 17 -22 17 -15
               C24 -14 27 -7 23 -1
               C28 4 25 12 18 14
               C19 22 11 27 3 22
               V-23Z"/>

        <!-- Brain details -->
        <path d="M-3 -13 H-11 V-7"/>
        <path d="M-3 0 H-14"/>
        <path d="M-3 12 H-10 V18"/>

        <path d="M3 -13 H11 V-7"/>
        <path d="M3 0 H14"/>
        <path d="M3 12 H10 V18"/>

        <!-- Circuit nodes -->
        <circle cx="-11" cy="-7" r="2.5" fill="#FFD700"/>
        <circle cx="-14" cy="0" r="2.5" fill="#FFD700"/>
        <circle cx="-10" cy="18" r="2.5" fill="#FFD700"/>

        <circle cx="11" cy="-7" r="2.5" fill="#FFD700"/>
        <circle cx="14" cy="0" r="2.5" fill="#FFD700"/>
        <circle cx="10" cy="18" r="2.5" fill="#FFD700"/>

    </g>

    <text x="50" y="115"
        font-size="18"
        fill="#ffd700">
        AI / ML
    </text>

</g>

</g>



<!-- Bottom Message -->

<text
